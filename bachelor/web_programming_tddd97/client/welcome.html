<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" type="text/css"href="welcome.css">
	</head>
	<body>
		<div id="welcome_outer_div">
            <div id="welcome_pic" class="welcome_inner_div">
                <img src="wimage.png" alt="Picture of twidder.">
            </div>
            
            <div class="welcome_inner_div">
                <form id="login_form" onsubmit="login(this); return false;">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br>
                    <label for="password">Password:</label>
                    <input type="text" id="password" name="password" required><br>
                    <input type="submit" value="login">
                  </form> 

                <form id="sign_up_form" onsubmit="sign_up(this); return false;">
                    <label for="fname">First name:</label>
                    <input type="text" id="fname" name="fname" required><br>
                    <label for="lname">Family name:</label>
                    <input type="text" id="lname" name="lname" required><br>

                    <select name="gender" id="gender" required>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select><br>
                    
                    <label for="country">Country:</label>
                    <input type="text" id="country" name="country" required><br>
                    <label for="city">City:</label>
                    <input type="text" id="city" name="city" required><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br>
                    
                    <label for="password">Password:</label>
                    <input type="text" id="password" name="password" required><br>

                    <label for="password_check">Repeat PWD:</label>
                    <input type="text" id="password_check" name="password_check" required><br>
                    
                    <input type="submit" value="signup">
                  </form> 
            </div>
        </div>
	</body>
</html>
